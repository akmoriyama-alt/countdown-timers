<style>
  :root {
    --navy:  #0B2E57;
    --ink:   #1D2B3A;
    --sub:   #6B7A8C;
    --blue-1: #38B2F0; --blue-2: #1386D6; --blue-3: #0B5FAE;
    --rose-1: #F7909A; --rose-2: #E2617A; --rose-3: #C2425F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #F6F8FB; }
  body { font-family: "Noto Sans JP", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; }
  .en { font-family: "Plus Jakarta Sans", "Noto Sans JP", sans-serif; }

  #stage { width: 1920px; height: 1080px; position: relative; flex: none; overflow: hidden; transform-origin: center center;
    background: linear-gradient(180deg, #FBFCFE 0%, #F1F5FA 100%); }

  /* ===== 背景：ゆっくり漂う光（transformだけ動かすので端末に負担をかけない） ===== */
  .aurora { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform; }
  .aurora.a1 { width: 1300px; height: 1300px; left: -380px; top: -260px;
    background: radial-gradient(circle, rgba(56,178,240,.30) 0%, rgba(56,178,240,.10) 38%, rgba(56,178,240,0) 68%);
    animation: drift1 48s ease-in-out infinite alternate; }
  .aurora.a2 { width: 1250px; height: 1250px; right: -360px; bottom: -420px;
    background: radial-gradient(circle, rgba(242,128,145,.28) 0%, rgba(242,128,145,.09) 38%, rgba(242,128,145,0) 68%);
    animation: drift2 56s ease-in-out infinite alternate; }
  .aurora.a3 { width: 900px; height: 900px; left: 640px; top: 420px;
    background: radial-gradient(circle, rgba(140,120,255,.10) 0%, rgba(140,120,255,0) 65%);
    animation: drift3 64s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(220px, 140px) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-200px, -120px) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-160px, -200px) scale(.9); } }
  /* 細かな点の地模様（質感） */
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(11,46,87,.07) 1px, transparent 1.2px); background-size: 22px 22px; }

  header { position: absolute; left: 110px; right: 110px; top: 72px; display: flex; justify-content: space-between; align-items: flex-start; }
  .logo svg { height: 84px; width: auto; display: block; fill: var(--navy); }
  .today { text-align: right; }
  .today .d { font-size: 32px; font-weight: 400; letter-spacing: .04em; color: var(--navy); }
  .today .t { font-size: 22px; font-weight: 400; letter-spacing: .14em; margin-top: 4px; color: var(--sub);
    display: inline-flex; align-items: center; gap: 10px; }
  .today .t::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2BC48A;
    box-shadow: 0 0 0 0 rgba(43,196,138,.5); animation: live 2.4s ease-out infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(43,196,138,.45); } 100% { box-shadow: 0 0 0 12px rgba(43,196,138,0); } }

  .heading { position: absolute; left: 0; right: 0; top: 160px; text-align: center; }
  .heading .label { font-size: 17px; font-weight: 600; letter-spacing: .42em; color: var(--blue-2); }
  .heading .label span { color: var(--rose-2); }
  .heading h1 { font-size: 58px; font-weight: 500; letter-spacing: .16em; color: var(--navy); margin-top: 4px; line-height: 1.3; }

  main { position: absolute; left: 80px; right: 80px; top: 300px; height: 618px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 56px; perspective: 2200px; perspective-origin: 50% 40%; }

  /* ===== すりガラスのパネル ===== */
  .exam { position: relative; border-radius: 36px; padding: 34px 48px 0; text-align: center; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(255,255,255,.52));
    -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%);
    border: 1.5px solid rgba(255,255,255,.9);
    transform-style: preserve-3d; transform: rotateY(var(--ry)) rotateX(3deg);
    animation: float 9s ease-in-out infinite; animation-delay: var(--fd);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,1),          /* 上辺のハイライト */
      inset 0 -3px 0 rgba(11,46,87,.05),            /* 下辺の陰り */
      0 1px 0 rgba(255,255,255,.9),
      0 6px 0 -1px var(--edge),                     /* パネルの厚み（縁） */
      0 10px 0 -3px var(--edge2),
      0 26px 40px -18px var(--glow),                /* 色つきの影 */
      0 70px 90px -50px rgba(11,46,87,.35); }       /* 床に落ちる影 */
  .exam.blue { --ry: 7deg;  --fd: 0s; }
  .exam.rose { --ry: -7deg; --fd: -4.5s; }
  @keyframes float { 0%, 100% { transform: rotateY(var(--ry)) rotateX(3deg) translateY(0); }
                     50%      { transform: rotateY(var(--ry)) rotateX(3deg) translateY(-10px); } }
  .exam.blue { --c1: var(--blue-1); --c2: var(--blue-2); --c3: var(--blue-3); --glow: rgba(19,134,214,.45); --tint: rgba(56,178,240,.16);
    --edge: rgba(150,200,236,.75); --edge2: rgba(96,160,214,.45); --ex1: #0A5398; --ex2: #084683; }
  .exam.rose { --c1: var(--rose-1); --c2: var(--rose-2); --c3: var(--rose-3); --glow: rgba(226,97,122,.42); --tint: rgba(247,144,154,.16);
    --edge: rgba(240,178,188,.8); --edge2: rgba(214,118,138,.45); --ex1: #A93652; --ex2: #922C46; }
  /* 角に試験の色をうっすら灯す */
  .exam::before { content: ""; position: absolute; width: 620px; height: 620px; right: -260px; top: -300px; border-radius: 50%;
    background: radial-gradient(circle, var(--tint), transparent 65%); pointer-events: none; }
  .exam > * { position: relative; }

  .tag { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; letter-spacing: .12em; color: #fff;
    padding: 8px 26px 8px 20px; border-radius: 999px; background: linear-gradient(135deg, var(--c1), var(--c3));
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 0 var(--ex2), 0 12px 20px -6px var(--glow); }
  .tag::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; opacity: .9; }
  .name { font-size: 23px; font-weight: 500; color: var(--sub); margin-top: 16px; letter-spacing: .06em; }
  .date { font-size: 27px; font-weight: 500; color: var(--navy); margin-top: 2px; letter-spacing: .05em; }
  .date small { font-size: 20px; letter-spacing: .14em; margin-left: 8px; color: var(--sub); }
  .date .start { font-family: "Noto Sans JP", sans-serif; font-size: 22px; font-weight: 500; margin-left: 20px; padding-left: 20px;
    border-left: 1.5px solid rgba(11,46,87,.15); color: var(--c3); letter-spacing: .08em; }

  .count { margin-top: 2px; display: flex; justify-content: center; align-items: baseline; gap: 16px; }
  .count .pre { font-size: 46px; font-weight: 500; color: var(--sub); }
  .count .unit { font-size: 64px; font-weight: 700; color: var(--c3); text-shadow: 0 2px 0 var(--ex2), 0 10px 14px var(--glow); }
  .days { font-size: 250px; font-weight: 800; line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 2px 0 var(--ex1)) drop-shadow(0 2px 0 var(--ex1)) drop-shadow(0 2px 0 var(--ex2)) drop-shadow(0 22px 26px var(--glow)); }
  .days .cur, .days .old { background: linear-gradient(170deg, var(--c1) 5%, var(--c2) 50%, var(--c3) 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hm { font-size: 66px; font-weight: 700; color: var(--navy); line-height: 1; margin-top: 8px; text-shadow: 0 2px 0 #D2DDEA, 0 10px 16px rgba(11,46,87,.14); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .hm .u { font-size: 28px; font-weight: 500; color: var(--sub); margin: 0 22px 0 8px; letter-spacing: .1em; }
  .message { font-size: 80px; font-weight: 700; letter-spacing: .1em; margin-top: 96px; line-height: 1.5; white-space: nowrap;
    background: linear-gradient(170deg, var(--c1), var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .message small { display: block; font-size: 30px; font-weight: 500; color: var(--sub); -webkit-text-fill-color: var(--sub); letter-spacing: .1em; }

  /* ===== 残り日数のタイムライン（1日＝1本） ===== */
  .timeline { position: absolute; left: 48px; right: 48px; bottom: 34px; height: 64px; }
  .ticks { position: absolute; left: 0; right: 0; top: 0; height: 38px; }
  .tick { position: absolute; bottom: 0; width: var(--tw); height: 22px; border-radius: 2px;
    background: linear-gradient(180deg, var(--c1), var(--c3)); }
  .tick.wk { height: 38px; }
  .tick.near { opacity: 1; }
  .tick.leaving { animation: leave 1.6s ease-out .3s both; }
  @keyframes leave { to { opacity: 0; transform: translateY(-26px) scaleY(.2); } }
  .flag { position: absolute; right: -6px; top: -10px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--c3); box-shadow: 0 0 0 6px var(--tint); }
  .tl-labels { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
    font-size: 14px; font-weight: 600; letter-spacing: .28em; color: var(--sub); }
  .tl-labels b { color: var(--c3); font-weight: 700; }
  .tl-labels .now { position: absolute; bottom: 0; color: var(--c3); }
  .tl-labels .mid { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
  .tl-labels b { margin-left: auto; }
  body.days-only .hm { display: none; }

  footer { position: absolute; left: 110px; right: 110px; bottom: 38px; display: flex; justify-content: space-between; align-items: center; }
  footer .msg { font-size: 26px; font-weight: 400; color: var(--sub); letter-spacing: .14em; }
  footer .msg b { font-weight: 700; color: var(--navy); }
  footer .tagline { font-size: 23px; font-weight: 500; color: var(--navy); letter-spacing: .2em; }

  /* ===== 演出：変わった桁だけ下から上へ入れ替わる＋日数が減る瞬間に光と弾み ===== */
  .dg { display: inline-block; position: relative; clip-path: inset(-6% -12%); }
  .dg .cur { display: inline-block; }
  .dg .old { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
  .dg.chg .cur { animation: dgIn .75s cubic-bezier(.22,.8,.26,1) both; }
  .dg.chg .old { animation: dgOut .75s cubic-bezier(.22,.8,.26,1) both; }
  @keyframes dgIn  { from { transform: translateY(80%); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
  @keyframes dgOut { from { transform: none; opacity: 1; } to { transform: translateY(-80%); opacity: 0; filter: blur(3px); } }
  .exam.dayup::after { content: ""; position: absolute; top: -10%; bottom: -10%; left: -45%; width: 36%; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0));
    transform: skewX(-16deg); animation: shine 1.5s cubic-bezier(.4,.1,.3,1) .35s both; }
  @keyframes shine { from { left: -45%; } to { left: 125%; } }
  .exam.dayup .days { animation: bump 1s cubic-bezier(.3,1.5,.5,1) .15s both; }
  @keyframes bump { 0% { transform: scale(.94); } 55% { transform: scale(1.05); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .exam { animation: none; }
    .aurora, .today .t::before, .dg.chg .cur, .dg.chg .old, .exam.dayup::after, .exam.dayup .days, .tick.leaving { animation: none; }
    .dg.chg .old, .tick.leaving { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="grain"></div>
  <header>
    <div class="logo" aria-label="日本医専"><svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.593 101.279">
  <g transform="translate(0.691 0.589)">
    <path d="M0,28.43V.95H21.032V23.418a4.8,4.8,0,0,1-5.164,5.016Zm3.394-2.764,11.87,0a2.159,2.159,0,0,0,2.4-2.332V15.264H3.394Zm0-13.122H17.661V3.715H3.394ZM69.882,28.43c-3.063,0-4.677-2.135-4.726-4.793L65.147.95h23.63V3.715H77.144a13.413,13.413,0,0,1-1.2,2.839H87.995V9.177H81.329v3.2h6.666v2.733H81.61c.442,2.979,3.612,5.271,7.167,6.021v2.859a12.609,12.609,0,0,1-9.055-5.676c-1.381,3.152-5.016,4.988-8.937,5.671V21.159c5.67-1.206,6.954-3.957,7.1-6.047H71.457l0-2.733h6.716v-3.2H73.956a12.043,12.043,0,0,1-3.625,2.554V8.44a9.883,9.883,0,0,0,3.8-4.725h-5.7s0,19.847.009,19.847a1.972,1.972,0,0,0,2.169,2.129H89.372V28.43Zm41.307-.006V25.706h3.282a1.933,1.933,0,0,0,2.085-1.9V21.449H97.41V18.908h19.147V17.273H99.566V6.658h9.524V5.023H98.219V2.487H109.09V0h3.2V2.487h10.748V5.023H112.295V6.658h9.51V17.273h-2.177v1.635H123.8v2.541h-4.171v2.372a4.664,4.664,0,0,1-4.924,4.6Zm1.145-13.688h6.429v-1.5h-6.429Zm-9.724,0h6.462v-1.5h-6.462Zm9.724-4.036h6.429V9.2h-6.429Zm-9.724,0h6.462V9.2h-6.462ZM41.367,28.424v-5.13h-5.7V20.546h5.7V7.916A23.337,23.337,0,0,1,29.013,23.4V19.913A19.838,19.838,0,0,0,38.527,7.194H29.913V4.443H41.367V.222h3.156V4.443H55.978V7.194H47.371A20.079,20.079,0,0,0,56.876,19.86v3.547a23.4,23.4,0,0,1-12.354-15.4v12.54h5.7v2.748h-5.7v5.13Zm59.557-5.487h3.659a19.336,19.336,0,0,1,3.612,4.577l-3.4.036A20.125,20.125,0,0,0,100.924,22.938Z" transform="translate(72.603 39.68)" stroke="rgba(0,0,0,0)" stroke-miterlimit="10" stroke-width="1"/>
    <path d="M0,96.786C9.69,90.625,21.995,77.5,28.019,66.909c5.853-10.291,8.8-21.116,8.453-30.641-2.6-6.259-8.116-14.976-14.508-23.432-1.441-1.912-3.057-3.8-3.6-6.194-.519-2.344.086-4.989,2.4-6.115l.022-.009c1.329-.636,5.1-1.69,9.319,3.927a34.878,34.878,0,0,1,3.313,5.637A67.3,67.3,0,0,1,38.99,26.966a64.057,64.057,0,0,1,.993,7.693c1.022,2.325,2.356,5.544,3.057,7.488a94.173,94.173,0,0,1,3.19,10.284,160.744,160.744,0,0,1,3.65-24.636c2.792-11.734,5.922-16.793,6.056-17l3.229,2.026c-.028.044-3,4.924-5.648,16.174-2.443,10.4-5.091,28.55-3.829,55.79H45.5c.121-22.949-3.084-33.035-5.642-40.212a68.362,68.362,0,0,1-8.521,24.222C25.052,79.844,12.186,93.552,2.049,100ZM22.178,4.456c-.556.965.2,2.246.7,3.057.753,1.234,1.912,2.592,3.353,4.655,1.24,1.771,3.739,5.38,5.651,8.193a61.529,61.529,0,0,1,3.242,5.358A65.353,65.353,0,0,0,27.777,7.76a10.717,10.717,0,0,0-3.3-3.5,2.48,2.48,0,0,0-1.24-.386A1.149,1.149,0,0,0,22.178,4.456Zm17.293,10.38a5.45,5.45,0,1,1,5.454,5.444A5.454,5.454,0,0,1,39.471,14.836Zm3.816,0A1.636,1.636,0,1,0,44.925,13.2,1.633,1.633,0,0,0,43.287,14.836Z" stroke="rgba(0,0,0,0)" stroke-miterlimit="10" stroke-width="1"/>
  </g>
</svg></div>
    <div class="today"><div class="d en" id="todayDate"></div><div class="t en" id="todayTime"></div></div>
  </header>
  <div class="heading">
    <div class="label en">NATIONAL EXAMINATION <span>COUNTDOWN</span></div>
    <h1>国家試験まで</h1>
  </div>
  <main id="exams"></main>
  <footer>
    <div class="msg" id="footerMsg"></div>
    <div class="tagline">人の未来を、すこやかに。</div>
  </footer>
</div>

<script>
/* ===================== CONFIG（毎年ここだけ直す） =====================
   date は試験日、target は試験開始時刻（どちらも日本時間）。開始時刻までを数える。
   出典：試験日＝厚生労働省 施行告示（令和8年9月1日 官報）
   ・第35回柔道整復師国家試験       令和9年3月7日（日） 開始 9:30 ※第34回の時間割。第35回は受験票で要確認
   ・第35回はり師・きゅう師国家試験 令和9年2月28日（日）開始 9:00 ※東洋療法研修試験財団 第35回受験案内（晴眼者）
========================================================================= */
const CONFIG = {
  exams: [
    { tag: "柔道整復師", name: "第35回 柔道整復師国家試験",       date: "2027-03-07", target: "09:30", color: "blue" },
    { tag: "はり師・きゅう師", name: "第35回 はり師・きゅう師国家試験", date: "2027-02-28", target: "09:00", color: "rose" },
  ],
  dayMessage:  ["試験開始", "全力を出しきろう"],
  afterMessage:["おつかれさまでした", "合格発表は 3月26日（金）14:00"],
  todayMessage:["本日、試験日", "開始時刻に向けて落ち着いて"],   // 日数のみモードの当日表示
  // 下の一文：開始前の試験のうち、近いほうの「あと◯日」で切り替える（上から順に判定）
  footerMessages: [
    { minDays: 101, text: "一日一日の積み重ねが、<b>合格</b>につながる。" },
    { minDays: 31,  text: "苦手を一つずつ、<b>得意</b>に変えていこう。" },
    { minDays: 8,   text: "最後の30日。積み上げたものを<b>確かめよう</b>。" },
    { minDays: 0,   text: "ここまでの<b>努力</b>を信じて。" },
  ],
  footerDefault: "一日一日の積み重ねが、<b>合格</b>につながる。",   // 両方の試験が始まった後
};
/* URLパラメータ：?mode=days → 日数だけ ／ ?now=2026-10-26T09:00 → 時刻を固定 ／ ?demo=1 → 1分を3秒で早送り（演出の確認用） */

const params = new URLSearchParams(location.search);
if (params.get("mode") === "days") document.body.classList.add("days-only");
const fixedNow = params.get("now");
const demo = params.get("demo") === "1";
const t0 = Date.now();
const base = fixedNow ? Date.parse(fixedNow + "+09:00") : t0;

const WEEK_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const pad = n => String(n).padStart(2, "0");

// 端末のタイムゾーンに関係なく日本時間で計算する
function nowJST() {
  if (demo) return base + (Date.now() - t0) * 20;
  return fixedNow ? base : Date.now();
}
function jstParts(ms) {
  const d = new Date(ms + 9 * 3600e3);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay(), hh: d.getUTCHours(), mi: d.getUTCMinutes() };
}

// 前回表示した桁と日数を覚えておき、変わった桁だけ演出する
let prevDigits = {}, nextDigits = {}, prevDays = {}, lastMinute = null;
function digits(str, key) {
  const n = str.length;
  return [...str].map((ch, j) => {
    const k = `${key}-${n - 1 - j}`, old = prevDigits[k];
    nextDigits[k] = ch;
    return (old !== undefined && old !== ch)
      ? `<span class="dg chg"><span class="cur">${ch}</span><span class="old" aria-hidden="true">${old}</span></span>`
      : `<span class="dg"><span class="cur">${ch}</span></span>`;
  }).join("");
}

// 残り日数を1日1本の線で並べる。右端が試験日。7日ごとに長い線。
function timeline(days, scale, leaving) {
  const width = 760, step = width / scale, tw = Math.max(2, Math.min(5, step * 0.5));
  let html = "";
  const n = Math.min(days, scale);
  for (let k = 0; k < n; k++) {
    const right = (k + 0.5) * step;
    html += `<i class="tick${(k + 1) % 7 === 0 ? " wk" : ""}" style="right:${right.toFixed(1)}px"></i>`;
  }
  if (leaving && n < scale) html += `<i class="tick leaving${(n + 1) % 7 === 0 ? " wk" : ""}" style="right:${((n + 0.5) * step).toFixed(1)}px"></i>`;
  return `<div class="timeline" style="--tw:${tw.toFixed(1)}px"><div class="ticks">${html}<span class="flag"></span></div>
    <div class="tl-labels en">${n * step > 280 ? `<span class="now" style="left:${Math.max(0, width - n * step).toFixed(0)}px">TODAY</span>` : ""}${(n * step > 280 && Math.abs((width - n * step) - width / 2) < 170) ? "" : `<span class="mid">1 LINE = 1 DAY</span>`}<b>EXAM DAY</b></div></div>`;
}

function render() {
  const now = nowJST();
  const minute = Math.floor(now / 60000);
  if (minute === lastMinute) return;   // 表示が変わらないときは描き直さない（演出を途中で切らない）
  lastMinute = minute;
  nextDigits = {};

  const t = jstParts(now);
  document.getElementById("todayDate").textContent = `${t.y}.${pad(t.m)}.${pad(t.d)} ${WEEK_EN[t.w]}`;
  document.getElementById("todayTime").textContent = `${pad(t.hh)}:${pad(t.mi)}`;

  // 先に各試験の残りを計算（タイムラインの目盛りを2枚でそろえるため）
  const info = CONFIG.exams.map(ex => {
    const dayStart = Date.parse(`${ex.date}T00:00+09:00`);
    const target   = Date.parse(`${ex.date}T${ex.target}+09:00`);
    const totalMin = Math.ceil((target - now) / 60000);   // 秒は切り上げて分に丸める
    return { ex, dayStart, dayEnd: dayStart + 86400e3, target, totalMin, days: Math.floor(totalMin / 1440) };
  });
  const maxDays = Math.max(30, ...info.filter(o => now < o.target).map(o => o.days + 1));
  const scale = Math.ceil(maxDays / 10) * 10;

  const parts = [];
  let nearestDays = Infinity;
  info.forEach(({ ex, dayStart, dayEnd, target, totalMin, days }, i) => {
    const e = jstParts(dayStart);
    let body, dayup = false;
    if (now >= dayEnd) {
      body = `<div class="message">${CONFIG.afterMessage[0]}<small>${CONFIG.afterMessage[1]}</small></div>`;
    } else if (now >= dayStart && now >= target) {
      body = `<div class="message">${CONFIG.dayMessage[0]}<small>${CONFIG.dayMessage[1]}</small></div>`;
    } else {
      nearestDays = Math.min(nearestDays, days);
      if (prevDays[i] !== undefined && days < prevDays[i]) dayup = true;
      prevDays[i] = days;
      const hours = Math.floor((totalMin % 1440) / 60);
      const mins = totalMin % 60;
      // 日数のみモードは「暦の上で何日後か」で数える
      const calDays = Math.round((dayStart - Date.parse(`${t.y}-${pad(t.m)}-${pad(t.d)}T00:00+09:00`)) / 86400e3);
      const daysOnly = document.body.classList.contains("days-only");
      if (daysOnly && calDays <= 0) {
        body = `<div class="message">${CONFIG.todayMessage[0]}<small>${CONFIG.todayMessage[1]}</small></div>`;
      } else body = `
        <div class="count"><span class="pre">あと</span><span class="days en">${digits(String(daysOnly ? calDays : days), i + "d")}</span><span class="unit">日</span></div>
        <div class="hm en">${digits(pad(hours), i + "h")}<span class="u">時間</span>${digits(pad(mins), i + "m")}<span class="u">分</span></div>
        ${timeline(daysOnly ? calDays : days, scale, dayup)}`;
    }
    parts.push(`
      <section class="exam ${ex.color || "blue"}${dayup ? " dayup" : ""}">
        <div class="tag">${ex.tag}</div>
        <div class="name">${ex.name}</div>
        <div class="date en">${e.y}.${e.m}.${e.d}<small>${WEEK_EN[e.w]}</small><span class="start">${ex.target.replace(/^0/, "")} 試験開始</span></div>
        ${body}
      </section>`);
  });
  document.getElementById("exams").innerHTML = parts.join("");
  prevDigits = nextDigits;
  const fm = CONFIG.footerMessages.find(m => nearestDays >= m.minDays);
  document.getElementById("footerMsg").innerHTML = (nearestDays === Infinity || !fm) ? CONFIG.footerDefault : fm.text;
}

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = `scale(${s})`;
}

addEventListener("resize", fit);
fit();
render();
if (demo) setInterval(render, 100);
else if (!fixedNow) {
  // 端末の時計と連動：毎分 0 秒ちょうどに表示を切り替える
  const tick = () => { render(); setTimeout(tick, 60000 - (Date.now() % 60000) + 50); };
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });   // 分が同じなら何もしない
  // サイネージの長時間表示対策：日本時間 4:00 に1日1回リロード
  setInterval(() => { const p = jstParts(Date.now()); if (p.hh === 4 && p.mi === 0) location.reload(); }, 60000);
}
</script>
</body>
</html>
