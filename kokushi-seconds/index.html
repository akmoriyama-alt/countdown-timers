<style>
  /* ===== 設定はページ下部の CONFIG を編集 ===== */
  :root {
    --primary: #00A0E9;   /* 日本医専 ブルー */
    --navy:    #004587;   /* 日本医専 ネイビー */
    --text:    #222222;
    --sub:     #707070;
    --line:    #DCE6EE;
    --bg:      #FFFFFF;
    --panel:   linear-gradient(135deg, #0A8FD6 0%, #0068B3 50%, #004587 100%);  /* 数字パネルの背景 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Noto Sans JP", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  /* 1920×1080 の舞台を画面に合わせて拡大縮小（16:9以外でも崩れない） */
  #stage {
    width: 1920px; height: 1080px;
    position: relative; flex: none;
    transform-origin: center center;
    background:
      radial-gradient(1200px 600px at 100% 0%, rgba(0,160,233,.06), transparent 70%),
      radial-gradient(900px 500px at 0% 100%, rgba(0,69,135,.04), transparent 70%),
      linear-gradient(180deg, #FFFFFF 0%, #F3F6F9 100%);
  }
  .en { font-family: "Plus Jakarta Sans", "Noto Sans JP", sans-serif; }

  header {
    position: absolute; left: 120px; right: 120px; top: 80px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .logo svg { height: 84px; width: auto; display: block; fill: var(--navy); }
  .today { text-align: right; color: var(--sub); }
  .today .d { font-size: 34px; font-weight: 300; letter-spacing: .04em; color: var(--navy); }
  .today .t { font-size: 22px; font-weight: 300; letter-spacing: .12em; margin-top: 6px; }

  .heading { position: absolute; left: 0; right: 0; top: 168px; text-align: center; }
  .heading .label { font-size: 18px; font-weight: 500; letter-spacing: .32em; color: var(--primary); }
  .heading h1 { font-size: 56px; font-weight: 500; letter-spacing: .16em; color: var(--navy); margin-top: 6px; line-height: 1.3; }

  main {
    position: absolute; left: 80px; right: 80px; top: 310px; height: 618px;
    /* この中だけ文字を白に */
    --navy: #FFFFFF; --sub: rgba(255,255,255,.8); --primary: #FFFFFF; --line: rgba(255,255,255,.3);
    color: #fff;
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: stretch;
  }
  .divider { width: 1px; height: 540px; margin-top: 20px; background: var(--line); }
  .exam { text-align: center; border-radius: 32px; padding-top: 34px; position: relative; overflow: hidden;
    background: radial-gradient(700px 400px at 85% -15%, rgba(255,255,255,.20), transparent 65%), var(--exam-bg);
    /* 立体感：接地の影＋色つきの柔らかい影＋上辺のハイライト＋下側の陰り */
    box-shadow:
      0 2px 4px rgba(0,30,70,.08),
      0 16px 30px -10px var(--exam-shadow),
      0 40px 70px -30px var(--exam-shadow),
      inset 0 1.5px 0 rgba(255,255,255,.45),
      inset 0 -24px 48px -24px rgba(0,0,0,.18); }
  /* 上半分のツヤ */
  .exam::before { content: ""; position: absolute; inset: 0 0 55% 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0)); }
  .exam > * { position: relative; }
  /* 試験ごとの色（CONFIG の color で指定） */
  .exam.blue { --exam-bg: linear-gradient(135deg, #3AAAE8 0%, #1586D0 55%, #0D6BB5 100%); --exam-shadow: rgba(13,107,181,.45); }  /* 柔整＝日本医専ブルー */
  .exam.rose { --exam-bg: linear-gradient(135deg, #F0828C 0%, #DE5F72 55%, #C94A63 100%); --exam-shadow: rgba(201,74,99,.40); }  /* 鍼灸＝やわらかい赤（ローズ） */
  .exam .tag {
    display: inline-block; font-size: 24px; font-weight: 500; letter-spacing: .14em;
    color: var(--primary); padding: 6px 24px; border: 1.5px solid rgba(255,255,255,.65); border-radius: 999px;
    background: rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px -4px rgba(0,0,0,.18);
  }
  .exam .name { font-size: 24px; font-weight: 400; color: var(--sub); margin-top: 16px; letter-spacing: .06em; }
  .exam .date { font-size: 28px; font-weight: 400; color: var(--navy); margin-top: 4px; letter-spacing: .06em; }
  .exam .date small { font-size: 22px; letter-spacing: .14em; margin-left: 8px; color: var(--sub); }
  .exam .date .start { font-family: "Noto Sans JP", sans-serif; font-size: 24px; margin-left: 22px; padding-left: 22px; border-left: 1px solid var(--line); color: var(--navy); letter-spacing: .08em; }

  .panel { margin-top: 6px; }
  .count { margin-top: 0; display: flex; justify-content: center; align-items: baseline; gap: 18px; color: #fff; text-shadow: 0 8px 22px rgba(0,0,0,.16); }
  .count .pre { font-size: 52px; font-weight: 300; color: rgba(255,255,255,.8); }
  .count .days { font-size: 280px; font-weight: 600; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .count .unit { font-size: 72px; font-weight: 500; }
  .hm { font-size: 76px; font-weight: 600; color: #fff; text-shadow: 0 6px 16px rgba(0,0,0,.14); letter-spacing: .04em; margin-top: 4px; line-height: 1; font-variant-numeric: tabular-nums; }
  .hm .sec { display: inline-block; min-width: 1.25em; text-align: center; }
  .hm span.u { font-size: 34px; font-weight: 400; color: rgba(255,255,255,.8); margin: 0 26px 0 8px; letter-spacing: .1em; }
  .message { font-size: 84px; font-weight: 400; color: #fff; text-shadow: 0 8px 22px rgba(0,0,0,.16); letter-spacing: .1em; margin-top: 110px; line-height: 1.6; white-space: nowrap; }
  .message small { display: block; font-size: 32px; color: rgba(255,255,255,.8); letter-spacing: .1em; }
  body.days-only .hm { display: none; }

  footer {
    position: absolute; left: 120px; right: 120px; bottom: 70px;
    display: flex; justify-content: space-between; align-items: center;
  }
  footer .msg { font-size: 26px; font-weight: 300; color: var(--sub); letter-spacing: .14em; }
  footer .msg b { font-weight: 400; color: var(--navy); }
  footer .tagline { font-size: 24px; font-weight: 400; color: var(--navy); letter-spacing: .2em; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="logo" aria-label="日本医専 人の未来を、すこやかに。"><svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.593 101.279">
  <g transform="translate(0.691 0.589)">
    <path d="M0,28.43V.95H21.032V23.418a4.8,4.8,0,0,1-5.164,5.016Zm3.394-2.764,11.87,0a2.159,2.159,0,0,0,2.4-2.332V15.264H3.394Zm0-13.122H17.661V3.715H3.394ZM69.882,28.43c-3.063,0-4.677-2.135-4.726-4.793L65.147.95h23.63V3.715H77.144a13.413,13.413,0,0,1-1.2,2.839H87.995V9.177H81.329v3.2h6.666v2.733H81.61c.442,2.979,3.612,5.271,7.167,6.021v2.859a12.609,12.609,0,0,1-9.055-5.676c-1.381,3.152-5.016,4.988-8.937,5.671V21.159c5.67-1.206,6.954-3.957,7.1-6.047H71.457l0-2.733h6.716v-3.2H73.956a12.043,12.043,0,0,1-3.625,2.554V8.44a9.883,9.883,0,0,0,3.8-4.725h-5.7s0,19.847.009,19.847a1.972,1.972,0,0,0,2.169,2.129H89.372V28.43Zm41.307-.006V25.706h3.282a1.933,1.933,0,0,0,2.085-1.9V21.449H97.41V18.908h19.147V17.273H99.566V6.658h9.524V5.023H98.219V2.487H109.09V0h3.2V2.487h10.748V5.023H112.295V6.658h9.51V17.273h-2.177v1.635H123.8v2.541h-4.171v2.372a4.664,4.664,0,0,1-4.924,4.6Zm1.145-13.688h6.429v-1.5h-6.429Zm-9.724,0h6.462v-1.5h-6.462Zm9.724-4.036h6.429V9.2h-6.429Zm-9.724,0h6.462V9.2h-6.462ZM41.367,28.424v-5.13h-5.7V20.546h5.7V7.916A23.337,23.337,0,0,1,29.013,23.4V19.913A19.838,19.838,0,0,0,38.527,7.194H29.913V4.443H41.367V.222h3.156V4.443H55.978V7.194H47.371A20.079,20.079,0,0,0,56.876,19.86v3.547a23.4,23.4,0,0,1-12.354-15.4v12.54h5.7v2.748h-5.7v5.13Zm59.557-5.487h3.659a19.336,19.336,0,0,1,3.612,4.577l-3.4.036A20.125,20.125,0,0,0,100.924,22.938Z" transform="translate(72.603 39.68)" stroke="rgba(0,0,0,0)" stroke-miterlimit="10" stroke-width="1"/>
    <path d="M0,96.786C9.69,90.625,21.995,77.5,28.019,66.909c5.853-10.291,8.8-21.116,8.453-30.641-2.6-6.259-8.116-14.976-14.508-23.432-1.441-1.912-3.057-3.8-3.6-6.194-.519-2.344.086-4.989,2.4-6.115l.022-.009c1.329-.636,5.1-1.69,9.319,3.927a34.878,34.878,0,0,1,3.313,5.637A67.3,67.3,0,0,1,38.99,26.966a64.057,64.057,0,0,1,.993,7.693c1.022,2.325,2.356,5.544,3.057,7.488a94.173,94.173,0,0,1,3.19,10.284,160.744,160.744,0,0,1,3.65-24.636c2.792-11.734,5.922-16.793,6.056-17l3.229,2.026c-.028.044-3,4.924-5.648,16.174-2.443,10.4-5.091,28.55-3.829,55.79H45.5c.121-22.949-3.084-33.035-5.642-40.212a68.362,68.362,0,0,1-8.521,24.222C25.052,79.844,12.186,93.552,2.049,100ZM22.178,4.456c-.556.965.2,2.246.7,3.057.753,1.234,1.912,2.592,3.353,4.655,1.24,1.771,3.739,5.38,5.651,8.193a61.529,61.529,0,0,1,3.242,5.358A65.353,65.353,0,0,0,27.777,7.76a10.717,10.717,0,0,0-3.3-3.5,2.48,2.48,0,0,0-1.24-.386A1.149,1.149,0,0,0,22.178,4.456Zm17.293,10.38a5.45,5.45,0,1,1,5.454,5.444A5.454,5.454,0,0,1,39.471,14.836Zm3.816,0A1.636,1.636,0,1,0,44.925,13.2,1.633,1.633,0,0,0,43.287,14.836Z" stroke="rgba(0,0,0,0)" stroke-miterlimit="10" stroke-width="1"/>

</svg></div>
    <div class="today"><div class="d en" id="todayDate"></div><div class="t en" id="todayTime"></div></div>
  </header>

  <div class="heading">
    <div class="label en">NATIONAL EXAMINATION COUNTDOWN</div>
    <h1>国家試験まで</h1>
  </div>

  <main id="exams"></main>

  <footer>
    <div class="msg" id="footerMsg"></div>
    <div class="tagline">人の未来を、すこやかに。</div>
  </footer>
</div>

<script>
/* ===================== CONFIG（毎年ここだけ直す） =====================
   date は試験日、target は試験開始時刻（どちらも日本時間）。開始時刻までを数える。
   出典：試験日＝厚生労働省 施行告示（令和8年9月1日 官報）
   ・第35回柔道整復師国家試験       令和9年3月7日（日） 開始 9:30 ※第34回の時間割。第35回は受験票で要確認
   ・第35回はり師・きゅう師国家試験 令和9年2月28日（日）開始 9:00 ※東洋療法研修試験財団 第35回受験案内（晴眼者）
========================================================================= */
const CONFIG = {
  exams: [
    { tag: "柔道整復師", name: "第35回 柔道整復師国家試験",       date: "2027-03-07", target: "09:30", color: "blue" },
    { tag: "はり師・きゅう師", name: "第35回 はり師・きゅう師国家試験", date: "2027-02-28", target: "09:00", color: "rose" },
  ],
  dayMessage:  ["試験開始", "全力を出しきろう"],
  afterMessage:["おつかれさまでした", "合格発表は 3月26日（金）14:00"],
  todayMessage:["本日、試験日", "開始時刻に向けて落ち着いて"],   // 日数のみモードの当日表示
  // 下の一文：開始前の試験のうち、近いほうの「あと◯日」で切り替える（上から順に判定）
  footerMessages: [
    { minDays: 101, text: "一日一日の積み重ねが、<b>合格</b>につながる。" },
    { minDays: 31,  text: "苦手を一つずつ、<b>得意</b>に変えていこう。" },
    { minDays: 8,   text: "最後の30日。積み上げたものを<b>確かめよう</b>。" },
    { minDays: 0,   text: "ここまでの<b>努力</b>を信じて。" },
  ],
  footerDefault: "一日一日の積み重ねが、<b>合格</b>につながる。",   // 両方の試験が始まった後
};
/* URLパラメータ：?mode=days → 日数だけ表示 ／ ?now=2026-10-26T09:00 → 表示時刻を固定（動画書き出し・確認用） */

const params = new URLSearchParams(location.search);
if (params.get("mode") === "days") document.body.classList.add("days-only");
const fixedNow = params.get("now");

const WEEK_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const WEEK_JA = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2, "0");

// 端末のタイムゾーンに関係なく日本時間で計算する
function nowJST() {
  const ms = fixedNow ? Date.parse(fixedNow + "+09:00") : Date.now();
  return ms;
}
function jstParts(ms) {
  const d = new Date(ms + 9 * 3600e3);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay(), hh: d.getUTCHours(), mi: d.getUTCMinutes(), ss: d.getUTCSeconds() };
}

function render() {
  const now = nowJST();
  const t = jstParts(now);
  document.getElementById("todayDate").textContent = `${t.y}.${pad(t.m)}.${pad(t.d)} ${WEEK_EN[t.w]}`;
  document.getElementById("todayTime").textContent = `${pad(t.hh)}:${pad(t.mi)}:${pad(t.ss)}`;

  const parts = [];
  let nearestDays = Infinity;
  CONFIG.exams.forEach((ex, i) => {
    const dayStart = Date.parse(`${ex.date}T00:00+09:00`);
    const dayEnd   = dayStart + 86400e3;
    const target   = Date.parse(`${ex.date}T${ex.target}+09:00`);
    const e = jstParts(dayStart);
    let body;
    if (now >= dayEnd) {
      body = `<div class="message">${CONFIG.afterMessage[0]}<small>${CONFIG.afterMessage[1]}</small></div>`;
    } else if (now >= dayStart && now >= target) {
      body = `<div class="message">${CONFIG.dayMessage[0]}<small>${CONFIG.dayMessage[1]}</small></div>`;
    } else {
      const totalSec = Math.ceil((target - now) / 1000);
      const days = Math.floor(totalSec / 86400);
      nearestDays = Math.min(nearestDays, days);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      // 日数のみモードは「暦の上で何日後か」で数える
      const calDays = Math.round((dayStart - Date.parse(`${t.y}-${pad(t.m)}-${pad(t.d)}T00:00+09:00`)) / 86400e3);
      const daysOnly = document.body.classList.contains("days-only");
      if (daysOnly && calDays <= 0) {
        body = `<div class="message">${CONFIG.todayMessage[0]}<small>${CONFIG.todayMessage[1]}</small></div>`;
      } else body = `
        <div class="count"><span class="pre">あと</span><span class="days en">${daysOnly ? calDays : days}</span><span class="unit">日</span></div>
        <div class="hm en">${pad(hours)}<span class="u">時間</span>${pad(mins)}<span class="u">分</span><span class="sec">${pad(secs)}</span><span class="u">秒</span></div>`;
    }
    parts.push(`
      <section class="exam ${ex.color || "blue"}">
        <div class="tag">${ex.tag}</div>
        <div class="name">${ex.name}</div>
        <div class="date en">${e.y}.${e.m}.${e.d}<small>${WEEK_EN[e.w]}</small><span class="start">${ex.target.replace(/^0/, "")} 試験開始</span></div>
        <div class="panel">${body}</div>
      </section>`);
  });
  document.getElementById("exams").innerHTML = parts.join("");
  const fm = CONFIG.footerMessages.find(m => nearestDays >= m.minDays);
  document.getElementById("footerMsg").innerHTML = (nearestDays === Infinity || !fm) ? CONFIG.footerDefault : fm.text;
}

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = `scale(${s})`;
}

addEventListener("resize", fit);
fit();
render();
if (!fixedNow) {
  // 端末の時計と連動：毎分 0 秒ちょうどに表示を切り替える
  // 毎秒ちょうどに表示を切り替える
  const tick = () => { render(); setTimeout(tick, 1000 - (Date.now() % 1000) + 20); };
  setTimeout(tick, 1000 - (Date.now() % 1000) + 20);
  // スリープ復帰・タブ復帰時もすぐ現在時刻に合わせる
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  // サイネージの長時間表示対策：日本時間 4:00 に1日1回リロード
  setInterval(() => { const p = jstParts(Date.now()); if (p.hh === 4 && p.mi === 0) location.reload(); }, 60000);
}
</script>
</body>
</html>
