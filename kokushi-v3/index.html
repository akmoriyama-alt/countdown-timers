<style>
  :root {
    --navy: #0B2E57; --sub: #6B7A8C; --line: #DFE7EF;
    --blue-1: #38B2F0; --blue-2: #1386D6; --blue-3: #0B5FAE; --blue-x: #084683;
    --rose-1: #F7909A; --rose-2: #E2617A; --rose-3: #C2425F; --rose-x: #922C46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FFFFFF; }
  body { font-family: "Noto Sans JP", sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; }
  .en { font-family: "Plus Jakarta Sans", "Noto Sans JP", sans-serif; }
  #stage { width: 1920px; height: 1080px; position: relative; flex: none; overflow: hidden; transform-origin: center center;
    background: linear-gradient(180deg, #FFFFFF 0%, #F6F9FC 100%); }

  /* ===== 右：残りの日々の立体（SVG。1ブロック＝1日） ===== */
  #field { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #field text { font-family: "Noto Sans JP", sans-serif; }
  .pulse { animation: pulse 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
  .sink { animation: sink 1.8s cubic-bezier(.5,.05,.4,1) .2s both; }
  @keyframes sink { to { transform: translateY(70px); opacity: 0; } }

  /* ===== 上部 ===== */
  header { position: absolute; left: 100px; right: 100px; top: 58px; display: flex; justify-content: space-between; align-items: flex-start; }
  .logo svg { height: 78px; width: auto; display: block; fill: var(--navy); }
  .today { text-align: right; }
  .today .d { font-size: 32px; font-weight: 400; letter-spacing: .04em; }
  .today .t { font-size: 24px; font-weight: 400; letter-spacing: .12em; margin-top: 2px; color: var(--sub); }
  .heading { position: absolute; left: 100px; top: 146px; }
  .heading .label { font-size: 16px; font-weight: 600; letter-spacing: .36em; color: var(--blue-2); }
  .heading h1 { font-size: 48px; font-weight: 500; letter-spacing: .14em; line-height: 1.3; margin-top: 2px; }

  /* ===== 左：カウントダウン ===== */
  .row { position: absolute; left: 100px; width: 860px; }
  .row.r0 { top: 248px; } .row.r1 { top: 610px; }
  .row.blue { --c1: var(--blue-1); --c2: var(--blue-2); --c3: var(--blue-3); --cx: var(--blue-x); --glow: rgba(19,134,214,.32); }
  .row.rose { --c1: var(--rose-1); --c2: var(--rose-2); --c3: var(--rose-3); --cx: var(--rose-x); --glow: rgba(226,97,122,.30); }
  .meta { display: flex; align-items: center; gap: 18px; }
  .tag { font-size: 24px; font-weight: 700; letter-spacing: .1em; color: #fff; padding: 6px 22px; border-radius: 999px;
    background: linear-gradient(135deg, var(--c1), var(--c3));
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 3px 0 var(--cx); }
  .date { font-size: 26px; font-weight: 500; letter-spacing: .04em; }
  .date small { font-size: 19px; letter-spacing: .12em; margin-left: 6px; color: var(--sub); }
  .date .start { font-family: "Noto Sans JP", sans-serif; font-size: 22px; font-weight: 500; margin-left: 16px; color: var(--c3); letter-spacing: .06em; }

  .count { display: flex; align-items: baseline; gap: 12px; margin-top: 8px; }
  .count .pre { font-size: 38px; font-weight: 500; color: var(--sub); }
  .count .unit { font-size: 66px; font-weight: 700; color: var(--c3); }
  .days { font-size: 280px; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 2px 0 var(--c3)) drop-shadow(0 2px 0 var(--cx)) drop-shadow(0 16px 18px var(--glow)); }
  .days .cur, .days .old { background: linear-gradient(170deg, var(--c1) 5%, var(--c2) 50%, var(--c3) 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hm { font-size: 66px; font-weight: 700; line-height: 1.12; margin-left: 22px; align-self: flex-end; margin-bottom: 30px; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .hm .u { font-size: 26px; font-weight: 500; color: var(--sub); margin-left: 6px; letter-spacing: .1em; }
  .message { font-size: 84px; font-weight: 700; letter-spacing: .08em; line-height: 1.4; margin-top: 60px; white-space: nowrap; color: var(--c3); }
  .message small { display: block; font-size: 28px; font-weight: 500; color: var(--sub); letter-spacing: .08em; }

  footer { position: absolute; left: 100px; right: 100px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; }
  footer .msg { font-size: 25px; font-weight: 400; color: var(--sub); letter-spacing: .12em; }
  footer .msg b { font-weight: 700; color: var(--navy); }
  footer .tagline { font-size: 22px; font-weight: 500; letter-spacing: .2em; }

  /* ===== 演出：変わった桁だけ下から上へ／日数が減る瞬間に弾む ===== */
  .dg { display: inline-block; position: relative; clip-path: inset(-6% -12%); }
  .dg .cur { display: inline-block; }
  .dg .old { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
  .dg.chg .cur { animation: dgIn .75s cubic-bezier(.22,.8,.26,1) both; }
  .dg.chg .old { animation: dgOut .75s cubic-bezier(.22,.8,.26,1) both; }
  @keyframes dgIn  { from { transform: translateY(80%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dgOut { from { transform: none; opacity: 1; } to { transform: translateY(-80%); opacity: 0; } }
  .row.dayup .days { animation: bump 1s cubic-bezier(.3,1.5,.5,1) .15s both; }
  @keyframes bump { 0% { transform: scale(.95); } 55% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .sink, .dg.chg .cur, .dg.chg .old, .row.dayup .days { animation: none; }
    .dg.chg .old { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="field" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <header>
    <div class="logo" aria-label="日本医専"><svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.593 101.279">
  <g transform="translate(0.691 0.589)">
    <path d="M0,28.43V.95H21.032V23.418a4.8,4.8,0,0,1-5.164,5.016Zm3.394-2.764,11.87,0a2.159,2.159,0,0,0,2.4-2.332V15.264H3.394Zm0-13.122H17.661V3.715H3.394ZM69.882,28.43c-3.063,0-4.677-2.135-4.726-4.793L65.147.95h23.63V3.715H77.144a13.413,13.413,0,0,1-1.2,2.839H87.995V9.177H81.329v3.2h6.666v2.733H81.61c.442,2.979,3.612,5.271,7.167,6.021v2.859a12.609,12.609,0,0,1-9.055-5.676c-1.381,3.152-5.016,4.988-8.937,5.671V21.159c5.67-1.206,6.954-3.957,7.1-6.047H71.457l0-2.733h6.716v-3.2H73.956a12.043,12.043,0,0,1-3.625,2.554V8.44a9.883,9.883,0,0,0,3.8-4.725h-5.7s0,19.847.009,19.847a1.972,1.972,0,0,0,2.169,2.129H89.372V28.43Zm41.307-.006V25.706h3.282a1.933,1.933,0,0,0,2.085-1.9V21.449H97.41V18.908h19.147V17.273H99.566V6.658h9.524V5.023H98.219V2.487H109.09V0h3.2V2.487h10.748V5.023H112.295V6.658h9.51V17.273h-2.177v1.635H123.8v2.541h-4.171v2.372a4.664,4.664,0,0,1-4.924,4.6Zm1.145-13.688h6.429v-1.5h-6.429Zm-9.724,0h6.462v-1.5h-6.462Zm9.724-4.036h6.429V9.2h-6.429Zm-9.724,0h6.462V9.2h-6.462ZM41.367,28.424v-5.13h-5.7V20.546h5.7V7.916A23.337,23.337,0,0,1,29.013,23.4V19.913A19.838,19.838,0,0,0,38.527,7.194H29.913V4.443H41.367V.222h3.156V4.443H55.978V7.194H47.371A20.079,20.079,0,0,0,56.876,19.86v3.547a23.4,23.4,0,0,1-12.354-15.4v12.54h5.7v2.748h-5.7v5.13Zm59.557-5.487h3.659a19.336,19.336,0,0,1,3.612,4.577l-3.4.036A20.125,20.125,0,0,0,100.924,22.938Z" transform="translate(72.603 39.68)" stroke="rgba(0,0,0,0)" stroke-miterlimit="10" stroke-width="1"/>
    <path d="M0,96.786C9.69,90.625,21.995,77.5,28.019,66.909c5.853-10.291,8.8-21.116,8.453-30.641-2.6-6.259-8.116-14.976-14.508-23.432-1.441-1.912-3.057-3.8-3.6-6.194-.519-2.344.086-4.989,2.4-6.115l.022-.009c1.329-.636,5.1-1.69,9.319,3.927a34.878,34.878,0,0,1,3.313,5.637A67.3,67.3,0,0,1,38.99,26.966a64.057,64.057,0,0,1,.993,7.693c1.022,2.325,2.356,5.544,3.057,7.488a94.173,94.173,0,0,1,3.19,10.284,160.744,160.744,0,0,1,3.65-24.636c2.792-11.734,5.922-16.793,6.056-17l3.229,2.026c-.028.044-3,4.924-5.648,16.174-2.443,10.4-5.091,28.55-3.829,55.79H45.5c.121-22.949-3.084-33.035-5.642-40.212a68.362,68.362,0,0,1-8.521,24.222C25.052,79.844,12.186,93.552,2.049,100ZM22.178,4.456c-.556.965.2,2.246.7,3.057.753,1.234,1.912,2.592,3.353,4.655,1.24,1.771,3.739,5.38,5.651,8.193a61.529,61.529,0,0,1,3.242,5.358A65.353,65.353,0,0,0,27.777,7.76a10.717,10.717,0,0,0-3.3-3.5,2.48,2.48,0,0,0-1.24-.386A1.149,1.149,0,0,0,22.178,4.456Zm17.293,10.38a5.45,5.45,0,1,1,5.454,5.444A5.454,5.454,0,0,1,39.471,14.836Zm3.816,0A1.636,1.636,0,1,0,44.925,13.2,1.633,1.633,0,0,0,43.287,14.836Z" stroke="rgba(0,0,0,0)" stroke-miterlimit="10" stroke-width="1"/>
  </g>
</svg></div>
    <div class="today"><div class="d en" id="todayDate"></div><div class="t en" id="todayTime"></div></div>
  </header>
  <div class="heading">
    <div class="label en">NATIONAL EXAMINATION COUNTDOWN</div>
    <h1>国家試験まで</h1>
  </div>
  <div id="exams"></div>
  <footer>
    <div class="msg" id="footerMsg"></div>
    <div class="tagline">人の未来を、すこやかに。</div>
  </footer>
</div>

<script>
/* ===================== CONFIG（毎年ここだけ直す） =====================
   date は試験日、target は試験開始時刻（どちらも日本時間）。開始時刻までを数える。
   出典：試験日＝厚生労働省 施行告示（令和8年9月1日 官報）
   ・第35回柔道整復師国家試験       令和9年3月7日（日） 開始 9:30 ※第34回の時間割。第35回は受験票で要確認
   ・第35回はり師・きゅう師国家試験 令和9年2月28日（日）開始 9:00 ※東洋療法研修試験財団 第35回受験案内（晴眼者）
========================================================================= */
const CONFIG = {
  exams: [
    { tag: "柔道整復師",       short: "柔整", date: "2027-03-07", target: "09:30", color: "blue" },
    { tag: "はり師・きゅう師", short: "鍼灸", date: "2027-02-28", target: "09:00", color: "rose" },
  ],
  weeks: 18,   // 立体に並べる週の数（最後の試験の週から数える）
  dayMessage:  ["試験開始", "全力を出しきろう"],
  afterMessage:["おつかれさまでした", "合格発表は 3月26日（金）14:00"],
  // 下の一文：開始前の試験のうち、近いほうの「あと◯日」で切り替える（上から順に判定）
  footerMessages: [
    { minDays: 101, text: "一日一日の積み重ねが、<b>合格</b>につながる。" },
    { minDays: 31,  text: "苦手を一つずつ、<b>得意</b>に変えていこう。" },
    { minDays: 8,   text: "最後の30日。積み上げたものを<b>確かめよう</b>。" },
    { minDays: 0,   text: "ここまでの<b>努力</b>を信じて。" },
  ],
  footerDefault: "一日一日の積み重ねが、<b>合格</b>につながる。",   // 両方の試験が始まった後
};
/* URLパラメータ：?now=2026-10-26T09:00 → 時刻を固定 ／ ?demo=1 → 1分を3秒で早送り（演出の確認用） */

const params = new URLSearchParams(location.search);
const fixedNow = params.get("now");
const demo = params.get("demo") === "1";
const t0 = Date.now();
const base = fixedNow ? Date.parse(fixedNow + "+09:00") : t0;

const WEEK_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const pad = n => String(n).padStart(2, "0");
const DAY = 86400e3;

// 端末のタイムゾーンに関係なく日本時間で計算する
function nowJST() {
  if (demo) return base + (Date.now() - t0) * 20;
  return fixedNow ? base : Date.now();
}
function jstParts(ms) {
  const d = new Date(ms + 9 * 3600e3);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay(), hh: d.getUTCHours(), mi: d.getUTCMinutes() };
}
const dayStartOf = ms => Math.floor((ms + 9 * 3600e3) / DAY) * DAY - 9 * 3600e3;

/* ---------- 右の立体：週を右奥へ、曜日を右手前へ並べる（等角投影） ---------- */
const TW = 72, TH = 36, OX = 962, OY = 822;
const proj = (u, v, z = 0) => [OX + (u + v) * TW / 2, OY + (v - u) * TH / 2 - z];
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const shade = (c, k) => c.map(x => Math.max(0, Math.min(255, Math.round(x * k))));
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

function block(u, v, h, top, cls = "") {
  const g = 0.07, a = u + g, b = u + 1 - g, c = v + g, d = v + 1 - g;
  // 上面の四隅と、見えている2つの側面
  const T = [proj(a, c, h), proj(b, c, h), proj(b, d, h), proj(a, d, h)];
  const L = [proj(a, c, h), proj(a, d, h), proj(a, d, 0), proj(a, c, 0)];
  const R = [proj(a, d, h), proj(b, d, h), proj(b, d, 0), proj(a, d, 0)];
  return `<g${cls ? ` class="${cls}"` : ""}><polygon points="${pts(L)}" fill="${rgb(shade(top, .86))}"/>` +
    `<polygon points="${pts(R)}" fill="${rgb(shade(top, .72))}"/><polygon points="${pts(T)}" fill="${rgb(top)}"/></g>`;
}
function tile(u, v) {
  const g = 0.07, a = u + g, b = u + 1 - g, c = v + g, d = v + 1 - g;
  return `<polygon points="${pts([proj(a, c), proj(b, c), proj(b, d), proj(a, d)])}" fill="#EEF3F8" stroke="#DFE7EF" stroke-width="1"/>`;
}

// 塔の方（右上）へ歩く人。足元が (x, y)。白いふちで背景のブロックから浮かせる
function person(x, y) {
  const body = "M0,-44 L-3,-24 M-3,-24 L9,-11 L7,0 M-3,-24 L-9,-11 L-16,-2 M0,-40 L11,-30 L18,-36 M0,-40 L-7,-30";
  const pack = `<rect x="-15" y="-45" width="12" height="20" rx="4"`;
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#0B2E57" opacity=".22"/>
    <path d="${body}" stroke="#fff" stroke-width="15"/>${pack} fill="#fff" stroke="#fff" stroke-width="8"/><circle cx="3" cy="-56" r="9" fill="#fff" stroke="#fff" stroke-width="8"/>
    ${pack} fill="#38B2F0"/><path d="${body}" stroke="#0B2E57" stroke-width="8"/><circle cx="3" cy="-56" r="9.5" fill="#0B2E57"/></g>`;
}

let lastDay = null;
function drawField(todayMs) {
  const exams = CONFIG.exams.map(ex => ({ ...ex, day: Date.parse(`${ex.date}T00:00+09:00`) }));
  const last = Math.max(...exams.map(e => e.day));
  const lp = jstParts(last);
  const lastMon = last - ((lp.w + 6) % 7) * DAY;                 // 最後の試験の週の月曜
  const start = lastMon - (CONFIG.weeks - 1) * 7 * DAY;
  const total = Math.round((last - start) / DAY);
  const PALE = [226, 238, 248], DEEP = [118, 190, 238];
  const COLORS = { blue: [19, 134, 214], rose: [226, 97, 122] };
  const items = [];
  for (let i = 0; i <= total; i++) {
    const ms = start + i * DAY;
    const u = Math.floor(i / 7), v = 6 - (i % 7);               // 日曜が一番奥の列（試験はどちらも右奥に立つ）
    const t = i / total;
    const exam = exams.find(e => e.day === ms);
    const passed = ms < todayMs;
    let svg;
    if (passed && !(lastDay !== null && ms === lastDay && lastDay !== todayMs)) svg = tile(u, v);
    else {
      const h = 8 + 148 * Math.pow(t, 1.7);
      if (ms === lastDay && lastDay !== todayMs) svg = tile(u, v) + block(u, v, h, mix(PALE, DEEP, t), "sink");   // 過ぎた日が沈む
      else if (exam) svg = block(u, v, h + 60, COLORS[exam.color]);
      else if (ms === todayMs) {
        svg = block(u, v, h + 12, [11, 46, 87]);
      } else svg = block(u, v, h, mix(PALE, DEEP, Math.pow(t, 1.2)));
    }
    items.push({ key: v - u, svg, u, v, i, ms, exam });
  }
  items.sort((a, b) => a.key - b.key);
  let html = `<defs><radialGradient id="gs"><stop offset="0" stop-color="#0B2E57" stop-opacity=".10"/><stop offset="1" stop-color="#0B2E57" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="1420" cy="740" rx="540" ry="260" fill="url(#gs)"/>`;
  html += items.map(o => o.svg).join("");

  // 月の目印（手前の縁に沿って）
  let prevM = null;
  for (let i = 0; i <= total; i += 7) {
    const p = jstParts(start + i * DAY), lastDayOfWeek = jstParts(start + (i + 6) * DAY);
    const m = lastDayOfWeek.m;
    if (m !== prevM) {
      const [x, y] = proj(Math.floor(i / 7) + .5, 7.75);
      html += `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-size="24" font-weight="500" fill="#6B7A8C" text-anchor="middle">${m}月</text>`;
      prevM = m;
    }
  }
  // 今日の目印：今日のブロックに立つ人（試験当日は塔の上に立つ）
  const ti = Math.round((todayMs - start) / DAY);
  if (ti >= 0 && ti <= total) {
    const u = Math.floor(ti / 7), v = 6 - (ti % 7), onExam = exams.some(e => e.day === todayMs);
    const h = 8 + 148 * Math.pow(ti / total, 1.7) + (onExam ? 60 : 12);
    const [x, y] = proj(u + .5, v + .5, h);
    if (!onExam) html += `<polygon class="pulse" points="${pts([proj(u + .07, v + .07, h), proj(u + .93, v + .07, h), proj(u + .93, v + .93, h), proj(u + .07, v + .93, h)])}" fill="#38B2F0"/>`;
    html += person(x, y);
    if (!onExam) html += `<text class="en" x="${x}" y="${y - 84}" font-size="22" font-weight="700" fill="#0B2E57" text-anchor="middle" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" style="font-family:'Plus Jakarta Sans';letter-spacing:.14em">TODAY</text>`;
  }
  // 試験の目印
  exams.forEach(e => {
    const i = Math.round((e.day - start) / DAY), u = Math.floor(i / 7), v = 6 - (i % 7);
    const h = 8 + 148 * Math.pow(i / total, 1.7) + 60;
    const [x, y] = proj(u + .5, v + .5, e.day < todayMs ? 0 : h);
    const p = jstParts(e.day), col = e.color === "rose" ? "#C2425F" : "#0B5FAE";
    const leftSide = e.day !== last || e.day === todayMs;
    const tx = leftSide ? x - 26 : x + 4, anchor = leftSide ? "end" : "middle", ty = y - (leftSide ? 34 : 56);
    if (e.day !== todayMs) html += `<line x1="${x}" y1="${y}" x2="${leftSide ? x - 18 : x}" y2="${y - (leftSide ? 26 : 44)}" stroke="${col}" stroke-width="2"/>`;
    html += `<text x="${tx}" y="${ty}" font-size="28" font-weight="700" fill="${col}" text-anchor="${anchor}" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${e.short} ${p.m}/${p.d}</text>`;
  });
  html += `<text x="1820" y="962" font-size="20" font-weight="500" fill="#6B7A8C" text-anchor="end">1ブロック = 1日</text>`;
  document.getElementById("field").innerHTML = html;
  lastDay = todayMs;
}

/* ---------- 左のカウントダウン ---------- */
// 前回表示した桁と日数を覚えておき、変わった桁だけ演出する
let prevDigits = {}, nextDigits = {}, prevDays = {}, lastMinute = null;
function digits(str, key) {
  const n = str.length;
  return [...str].map((ch, j) => {
    const k = `${key}-${n - 1 - j}`, old = prevDigits[k];
    nextDigits[k] = ch;
    return (old !== undefined && old !== ch)
      ? `<span class="dg chg"><span class="cur">${ch}</span><span class="old" aria-hidden="true">${old}</span></span>`
      : `<span class="dg"><span class="cur">${ch}</span></span>`;
  }).join("");
}

function render() {
  const now = nowJST();
  const minute = Math.floor(now / 60000);
  if (minute === lastMinute) return;   // 表示が変わらないときは描き直さない（演出を途中で切らない）
  lastMinute = minute;
  nextDigits = {};

  const t = jstParts(now);
  document.getElementById("todayDate").textContent = `${t.y}.${pad(t.m)}.${pad(t.d)} ${WEEK_EN[t.w]}`;
  document.getElementById("todayTime").textContent = `${pad(t.hh)}:${pad(t.mi)}`;
  const todayMs = dayStartOf(now);
  if (todayMs !== lastDay) drawField(todayMs);

  const parts = [];
  let nearestDays = Infinity;
  CONFIG.exams.forEach((ex, i) => {
    const dayStart = Date.parse(`${ex.date}T00:00+09:00`);
    const target   = Date.parse(`${ex.date}T${ex.target}+09:00`);
    const e = jstParts(dayStart);
    let body, dayup = false;
    if (now >= dayStart + DAY) {
      body = `<div class="message">${CONFIG.afterMessage[0]}<small>${CONFIG.afterMessage[1]}</small></div>`;
    } else if (now >= target) {
      body = `<div class="message">${CONFIG.dayMessage[0]}<small>${CONFIG.dayMessage[1]}</small></div>`;
    } else {
      const totalMin = Math.ceil((target - now) / 60000);   // 秒は切り上げて分に丸める
      const days = Math.floor(totalMin / 1440);
      nearestDays = Math.min(nearestDays, days);
      if (prevDays[i] !== undefined && days < prevDays[i]) dayup = true;
      prevDays[i] = days;
      const hours = Math.floor((totalMin % 1440) / 60), mins = totalMin % 60;
      body = `
        <div class="count"><span class="pre">あと</span><span class="days en">${digits(String(days), i + "d")}</span><span class="unit">日</span>
          <div class="hm en"><div>${digits(pad(hours), i + "h")}<span class="u">時間</span></div><div>${digits(pad(mins), i + "m")}<span class="u">分</span></div></div></div>`;
    }
    parts.push(`
      <section class="row r${i} ${ex.color || "blue"}${dayup ? " dayup" : ""}">
        <div class="meta"><div class="tag">${ex.tag}</div>
          <div class="date en">${e.y}.${e.m}.${e.d}<small>${WEEK_EN[e.w]}</small><span class="start">${ex.target.replace(/^0/, "")} 試験開始</span></div></div>
        ${body}
      </section>`);
  });
  document.getElementById("exams").innerHTML = parts.join("");
  prevDigits = nextDigits;
  const fm = CONFIG.footerMessages.find(m => nearestDays >= m.minDays);
  document.getElementById("footerMsg").innerHTML = (nearestDays === Infinity || !fm) ? CONFIG.footerDefault : fm.text;
}

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = `scale(${s})`;
}

addEventListener("resize", fit);
fit();
render();
if (demo) setInterval(render, 100);
else if (!fixedNow) {
  // 端末の時計と連動：毎分 0 秒ちょうどに表示を切り替える
  const tick = () => { render(); setTimeout(tick, 60000 - (Date.now() % 60000) + 50); };
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });   // 分が同じなら何もしない
  // サイネージの長時間表示対策：日本時間 4:00 に1日1回リロード
  setInterval(() => { const p = jstParts(Date.now()); if (p.hh === 4 && p.mi === 0) location.reload(); }, 60000);
}
</script>
</body>
</html>
